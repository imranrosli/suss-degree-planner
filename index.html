<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#315c4c"><title>SUSS Degree Planner</title><link rel="stylesheet" href="styles.css"></head><body>
<div id="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">✳</div><div><strong>Degree Planner</strong><small>My SUSS workspace</small></div></div><div class="side-label">MY WORKSPACE</div><nav id="nav"></nav><div class="sidebar-foot"><div class="sidebar-note"><span>DEGREE PROGRESS</span><strong id="sidebarCUs">0 / 170 CU</strong><div class="meter"><i id="sidebarMeter" style="width:0%"></i></div><small>Progress counts completed CU only</small></div><span class="side-foot-label">Private · Free · Runs locally</span></div></aside>
<div class="shell"><header class="topbar"><button id="menuButton" class="iconbtn hamburger" aria-label="Show menu">☰</button><div class="crumb">MY DEGREE <span>/</span> <strong id="crumb">Dashboard</strong></div><div class="top-actions"><span class="offline-pill">● Offline workspace</span><button id="backupQuick" class="btn small light">↓ Backup</button></div></header><main id="content" class="content"></main></div></div>
<div id="modalBack" class="modal-back hidden" role="presentation"><div id="modal" class="modal" role="dialog" aria-modal="true"><button class="modal-close" id="closeModal" aria-label="Close">×</button><div id="modalInner"></div></div></div><div id="toast" class="toast" role="status"></div>
<input id="pdfInput" type="file" accept=".pdf,.txt,.json,.csv" hidden><input id="restoreInput" type="file" accept=".json" hidden>
<script src="seed.js"></script><script src="app.js"></script></body></html>
